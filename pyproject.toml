[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "remlax"
version = "0.1.0"
description = "Generic REML solver for linear mixed models, differentiable and GPU-capable"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Nicolas Salas", email = "nicolas.salas@supagro.fr" }]
keywords = ["REML", "linear mixed model", "variance components",
            "quantitative genetics", "JAX", "GPU"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = ["jax>=0.4.30", "numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
cuda = ["jax[cuda12]>=0.4.30"]
test = ["pytest>=7"]
bench = ["pandas>=2.0", "matplotlib>=3.7"]
docs = ["mkdocs-material>=9.5", "mkdocstrings[python]>=0.24"]

[project.scripts]
remlax = "remlax.cli:main"

[project.urls]
Homepage = "https://github.com/NicoSalas34/remlax"
Issues = "https://github.com/NicoSalas34/remlax/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
python_files = ["test_*.py"]
