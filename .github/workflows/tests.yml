name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  python:
    name: "python ${{ matrix.python }} (CPU)"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
      # Le GPU n'est pas disponible sur un runner GitHub : la suite tourne sur
      # CPU. La parite CPU/GPU est verifiee separement, sur machine equipee
      # (benchmarks/ et tests/python/parite_gpu.py).
      - name: unit tests
        run: python -m pytest -q
      - name: algebraic reference suite
        run: python tests/python/test_remlkit_core.py
      - name: random stress sweep (reduced)
        run: python tests/python/stress_remlkit.py --n 30
