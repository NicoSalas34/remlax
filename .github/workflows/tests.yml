name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  engine:
    name: "engine, python ${{ matrix.python }} (CPU)"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: install
        run: python -m pip install --upgrade pip "jax>=0.4.30" "numpy>=1.24" "scipy>=1.10" pytest
      # Le moteur vit dans inst/python/remlax ; les tests le trouvent par ce
      # chemin. Le GPU n'est pas disponible sur un runner GitHub.
      - name: unit tests
        env:
          PYTHONPATH: inst/python
        run: python -m pytest -q -c tests-python/pytest.ini tests-python
      - name: algebraic reference suite
        env:
          PYTHONPATH: inst/python
        run: python tests-python/test_remlax_core.py
      - name: random stress sweep (reduced)
        env:
          PYTHONPATH: inst/python
        run: python tests-python/stress_remlax.py --n 30

  r-package:
    name: "R CMD check --as-cran (${{ matrix.python && 'with' || 'without' }} Python)"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: [true, false]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        if: matrix.python
        with:
          python-version: "3.12"
      - name: python solver dependencies
        if: matrix.python
        run: python -m pip install "jax>=0.4.30" numpy scipy
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck, any::roxygen2
      - name: Rd up to date
        run: |
          Rscript -e 'roxygen2::roxygenise(roclets = "rd")'
          git diff --exit-code -- man || { echo "man/ desynchronise : relancer roxygenise"; exit 1; }
      # Sans Python, c'est la situation de CRAN : les tests d'ajustement
      # s'ignorent, les vignettes se construisent sans executer le moteur.
      - name: R CMD check
        env:
          RX_PY: ${{ matrix.python && 'python' || '/nonexistent/python' }}
          _R_CHECK_FORCE_SUGGESTS_: "false"
        run: Rscript -e 'rcmdcheck::rcmdcheck(".", args = c("--no-manual", "--as-cran"), error_on = "warning")'
